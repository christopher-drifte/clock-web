<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <!-- Clock circle background -->
    <circle cx="32" cy="32" r="30" fill="#863bff" stroke="#7e14ff" stroke-width="2" />
    <circle cx="32" cy="32" r="28" fill="#aa3bff" />

    <!-- Clock center dot -->
    <circle cx="32" cy="32" r="2.5" fill="#ffffff" />

    <!-- Hour markers -->
    <circle cx="32" cy="8" r="1.5" fill="#ffffff" />
    <circle cx="32" cy="56" r="1.5" fill="#ffffff" />
    <circle cx="8" cy="32" r="1.5" fill="#ffffff" />
    <circle cx="56" cy="32" r="1.5" fill="#ffffff" />
    <circle cx="47" cy="17" r="1.2" fill="#ede6ff" />
    <circle cx="17" cy="17" r="1.2" fill="#ede6ff" />
    <circle cx="47" cy="47" r="1.2" fill="#ede6ff" />
    <circle cx="17" cy="47" r="1.2" fill="#ede6ff" />

    <!-- Hour hand pointing at 10 -->
    <line x1="32" y1="32" x2="22" y2="20" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />

    <!-- Minute hand pointing at 2 -->
    <line x1="32" y1="32" x2="44" y2="22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Second hand pointing at 6 -->
    <line x1="32" y1="32" x2="32" y2="50" stroke="#47bfff" stroke-width="1.5" stroke-linecap="round" />
</svg>